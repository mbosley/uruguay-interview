version: '3.8'

services:
  # FastAPI backend
  api:
    build: .
    container_name: research-api
    ports:
      - "8000:8000"
    environment:
      # API Keys - set these in .env file
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - KIMI_PROVIDER=${KIMI_PROVIDER:-groq}
    volumes:
      # Mount data directory read-only
      - ../data:/app/data:ro
      # Mount results directory for saving
      - ./results:/app/results
    command: python web_demo/api_server.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Streamlit frontend
  streamlit:
    build: .
    container_name: research-ui
    ports:
      - "8501:8501"
    environment:
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - KIMI_PROVIDER=${KIMI_PROVIDER:-groq}
    volumes:
      - ../data:/app/data:ro
      - ./results:/app/results
    command: streamlit run web_demo/app.py --server.port=8501 --server.address=0.0.0.0
    depends_on:
      - api
    restart: unless-stopped

  # Nginx reverse proxy (optional, for production)
  nginx:
    image: nginx:alpine
    container_name: research-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - streamlit
    restart: unless-stopped